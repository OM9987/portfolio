AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Portfolio backend API running on AWS Lambda (.NET 8) with API Gateway HTTP API.

Parameters:
  AllowedOrigins:
    Type: String
    Default: http://localhost:3000
    Description: Semicolon-separated list of allowed CORS origins for the backend API.
  DynamoDbTableName:
    Type: String
    Default: portfolio-data
    Description: DynamoDB table that stores portfolio entities.

Resources:
  PortfolioHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration: false
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 20

  AspNetCoreFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/Portfolio.Api/
      Handler: Portfolio.Api::Portfolio.Api.LambdaEntryPoint::FunctionHandlerAsync
      Runtime: dotnet8
      MemorySize: 256
      Timeout: 10
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBReadPolicy:
            TableName: !Ref DynamoDbTableName
      Environment:
        Variables:
          AllowedOrigins: !Ref AllowedOrigins
          DynamoDbTableName: !Ref DynamoDbTableName
      Events:
        ProxyResource:
          Type: HttpApi
          Properties:
            ApiId: !Ref PortfolioHttpApi
            Path: /{proxy+}
            Method: ANY
        RootResource:
          Type: HttpApi
          Properties:
            ApiId: !Ref PortfolioHttpApi
            Path: /
            Method: ANY

Outputs:
  ApiURL:
    Description: Portfolio HTTP API endpoint URL
    Value: !Sub https://${PortfolioHttpApi}.execute-api.${AWS::Region}.amazonaws.com/
